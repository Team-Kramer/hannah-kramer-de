# Deploys the static SvelteKit site (and the Godot Web export) to GitHub Pages.
# Pages source must be set to "GitHub Actions" (build_type: workflow).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build (prerender)
        run: pnpm build

      # Godot Web export (D8). Skipped when game/ is unchanged.
      - name: Godot Web export
        if: hashFiles('game/**') != ''
        run: |
          GODOT_VERSION=4.4-stable
          GODOT_DIR="$HOME/godot"
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/$GODOT_VERSION"
          mkdir -p "$GODOT_DIR" "$TEMPLATES_DIR"
          curl -sL -o "$GODOT_DIR/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"
          curl -sL -o "$TEMPLATES_DIR/templates.zip" \
            "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q "$TEMPLATES_DIR/templates.zip" -d "$TEMPLATES_DIR"
          # --verbose: the import cancels a task ("1 resources still in use at
          # exit") because a resource (theme/font) is loaded at startup before
          # its import runs. Verbose names the held resource so we can break
          # the cycle. Output goes to a file; only the relevant lines are shown.
          "$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64" --headless --path game --import --verbose > /tmp/godot-import.log 2>&1 || true
          echo "=== import: resources still in use / canceled ==="
          grep -iE "still in use|in use|canceled|Do not use progress|Cannot open|Failed loading" /tmp/godot-import.log | head -60
          mkdir -p game/.export/web
          "$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64" --headless --path game \
            --export-release "The Best Game Ever" "$GITHUB_WORKSPACE/game/.export/web/index.html"

      - name: Stage engine at /spiel/engine/
        if: hashFiles('game/**') != ''
        run: |
          mkdir -p build/spiel/engine
          cp -r game/.export/web/* build/spiel/engine/
          # The engine's index.html must not shadow the prerendered /spiel/ shell.
          ls -la build/spiel/engine

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
