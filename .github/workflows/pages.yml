# Deploys the static SvelteKit site (and the Godot Web export) to GitHub Pages.
# Pages source must be set to "GitHub Actions" (build_type: workflow).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build (prerender)
        run: pnpm build

      # Godot Web export (D8). Skipped when game/ is unchanged.
      - name: Godot Web export
        if: hashFiles('game/**') != ''
        run: |
          docker run --rm \
            -v "$PWD/game:/game" \
            godotengine/godot:4.4-stable \
            --headless --path /game \
            --export-release "The Best Game Ever" /game/.export/web/index.html

      - name: Stage engine at /spiel/engine/
        if: hashFiles('game/**') != ''
        run: |
          mkdir -p build/spiel/engine
          cp -r game/.export/web/* build/spiel/engine/
          # The engine's index.html must not shadow the prerendered /spiel/ shell.
          ls -la build/spiel/engine

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
