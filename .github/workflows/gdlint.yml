# GDScript lint (gdtoolkit) for the ported game/ tree.
# Ported from GodotProjectZero/.github/workflows/gdlint.yml; paths re-homed to game/.
name: gdlint

on:
  push:
    paths:
      - 'game/**'
  pull_request:
    paths:
      - 'game/**'

jobs:
  gdlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      - name: Run gdlint
        working-directory: game
        run: gdlint assets global resources scenes tests
